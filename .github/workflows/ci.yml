# Сборка, тесты (mvn verify), проверка Dockerfile.
# Опционально: вызов deploy hook (Render и аналоги) и GET /actuator/health.
#
# GitHub → Settings → Secrets and variables → Actions:
#   Secret  DEPLOY_HOOK_URL   — URL deploy hook из панели PaaS (можно не задавать).
#   Variable APP_BASE_URL     — публичный URL сервиса, например https://autosalon.onrender.com
#                               (без слэша в конце; можно не задавать).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven verify
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Docker build (без push)
        run: docker build -t autosalon:ci .

  deploy-hook-and-health:
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Вызов deploy hook PaaS (если задан секрет)
        id: hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "hook=false" >> "$GITHUB_OUTPUT"
            echo "Секрет DEPLOY_HOOK_URL не задан — автодеплой не вызывается."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "hook=true" >> "$GITHUB_OUTPUT"
          echo "Deploy hook вызван."

      - name: Пауза после деплоя
        if: steps.hook.outputs.hook == 'true'
        run: sleep 60

      - name: Проверка GET /actuator/health
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "Переменная APP_BASE_URL не задана — healthcheck пропущен."
            exit 0
          fi
          echo "Проверка: ${APP_BASE_URL}/actuator/health"
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS "${APP_BASE_URL}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Health: UP"
              ok=1
              break
            fi
            echo "Попытка $i/15, ждём 10 с..."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Healthcheck не прошёл за отведённое время."
            exit 1
          fi
