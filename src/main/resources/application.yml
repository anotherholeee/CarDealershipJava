spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autosalon}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 55MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  upload-dir: ${APP_UPLOAD_DIR:${user.dir}/uploads}
  max-images-per-car: 10
  admin:
    # Создаётся при старте, если пользователя с таким логином ещё нет. Смените пароль в проде.
    username: ${APP_ADMIN_USERNAME:+375299000001}
    password: ${APP_ADMIN_PASSWORD:admin123}
